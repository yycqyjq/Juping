# 桌面闸门 —— 不需要真机、也不需要 Android SDK 的那几道。
#
# 五道闸里有三道只依赖 JDK / python3：
#   protocol —— 把真实的 DLNA 协议层编译到桌面 JVM，用原始 socket 跑 214 项一致性检查
#   policy   —— 播放重连策略的 57 项断言 + 全部源码级不变量守卫
#   secrets  —— 签名密钥没有混进被跟踪的文件（这仓库是公开的，这道不能省）
#
# 另外 两道（API 引用核对、dex 入口点）必须先编 APK，要装整套 Android SDK，
# 在 CI 上要 10 分钟以上 —— 收益撑不起耗时（这两道依赖"产物与源码的对应关系"，
# 本地出包时反正会跑），所以刻意不进 CI。本地 ./tools/build.sh dist 一条命令全跑。
#
# 这份 workflow 本身不碰任何机密：它只读仓库、只跑测试，没有 deploy key、
# 没有签名密钥 —— 所以 secrets 那道闸对它自己也是适用的。

name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    name: DLNA 协议一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 跑协议测试
        run: ./tools/build.sh protocol

  policy:
    name: 播放策略断言
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 跑策略测试
        run: ./tools/build.sh policy

  secrets:
    name: 密钥核查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 核查没有密钥混进仓库
        run: python3 tools/check_no_secrets.py
