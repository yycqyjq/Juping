# Gradle 构建参数
#
# 这台机器是 Apple Silicon + JDK 17，AGP 7.4.2 在 JDK 17 上工作正常。
# 内存给到 3g 是为了让 d8/dex 阶段不至于 OOM；本机不是老盒子，不用担心占用。

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# 关闭 AndroidX / Jetifier：本项目刻意零依赖，开了反而会拖慢构建
android.useAndroidX=false
android.enableJetifier=false

# 并行 + 缓存，构建更快
org.gradle.parallel=true
org.gradle.caching=true

# 老 targetSdk 会触发一些 lint 提示，构建阶段不需要它挡路
android.suppressUnsupportedCompileSdk=33
