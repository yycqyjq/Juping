apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// release 签名配置
//
// 密钥库密码不写在构建脚本里，而是从根目录的 keystore.properties 读 ——
// 那个文件已被 .gitignore 忽略，不会跟着代码一起泄露出去。
//
// 为什么密钥用 SHA1withRSA 而不是 SHA256withRSA：
//   目标设备是 Android 4.0.4（API 15）。API 18 以下的平台对签名算法的支持很窄，
//   SHA1withRSA 是唯一能确定被认的。keytool 会警告「SHA1 是弱算法」——
//   这个警告在这里是刻意接受的：这把密钥只用于本地侧载，不参与任何信任链，
//   SHA-1 的碰撞攻击面在「自己签自己」的场景下不构成实际风险。
//   兼容性 > 理论强度，这是老设备上的取舍。
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasSigningConfig = keystorePropsFile.exists()
if (hasSigningConfig) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.juping.cast'
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.juping.cast"
        // 目标设备已实测确认：Android 4.0.4（API 15）、MediaTek MT5880、0.6GB RAM。
        // minSdk 14 保持不变 —— 覆盖 4.0.4 的同时不排除更老的设备，没有坏处。
        minSdkVersion 14
        // 刻意压低 targetSdk：避免 Android 5.0+ 的运行时权限模型、
        // 后台服务限制等新行为落到这个老设备上。
        targetSdkVersion 19
        // versionCode 随每次「要拿去装机」的包递增。
        // 覆盖安装本身不看它，但「设置 → 应用信息」里能靠它一眼分辨
        // 装的是哪一版 —— 真机排障时很有用（分不清新旧会白试一轮）。
        //
        // versionName 是给人看的语义化版本，发版规则（用户定的）：
        //   小更新（修 bug、小改进）→ 改最后一位：0.1.11 → 0.1.12
        //   中等更新（新能力、行为变更）→ 改中间那位，末位归零：0.2.1 → 0.3.0
        //   大更新 → 改第一位（暂未用到）
        // 界面上的"版本"直接读这个值，所以发版只需改这一处。
        versionCode 24
        versionName "0.2.9"
    }

    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // 显式打开 v1（JAR）签名。Android 7.0 以下只认 v1，
                // 而本机是 4.0.4 —— v2/v3 在这台设备上等于没有签名。
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            // R8：压缩 + 混淆 + 优化。
            //
            // 为什么敢在 minSdk 14 上开：本项目**零反射、零第三方依赖**，
            // 所有引用都是编译期确定的，R8 的静态分析能看全 ——
            // 不存在"被裁掉但运行时又需要"的东西。规则文件几乎是空的，
            // 唯一的作用是保住行号和源文件名，见 app/proguard-rules.pro。
            //
            // 另一条硬要求：**不能**顺手加 -assumenosideeffects 去删 Log。
            // 这个项目的排障全靠 logcat，理由写在规则文件里了。
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // 构建不要被 lint 拦下来（老 targetSdk 注定会有一堆「过时」提示）
        abortOnError false
        checkReleaseBuilds false

        // ------------------------------------------------------------------
        // 下面这些是**刻意保留**的 lint 警告，不是漏掉的。
        // 每一条都写明理由，免得以后有人看到警告顺手「修」出一个真机崩溃。
        // ------------------------------------------------------------------
        disable(
                // targetSdk 19 是刻意选的：本机是 Android 4.0.4，
                // 抬高 targetSdk 只会引入 5.0+ 的运行时权限与后台限制，有害无益。
                'ExpiredTargetSdkVersion',
                'OldTargetApi',

                // PendingIntent 的 FLAG_IMMUTABLE / FLAG_MUTABLE 是 API 23 才有的常量。
                // 本机 API 15，加上去会在真机上 NoSuchFieldError 直接崩。
                'UnspecifiedImmutableFlag',

                // layout_marginStart / paddingStart 是 API 17 才有的属性。
                // 本机 API 15，只能继续用 Left/Right。
                'RtlHardcoded',

                // 提示「要 Wi-Fi 权限会限制纯以太网电视」—— 但这里躲不掉：
                // SSDP 需要的 MulticastLock 只有 WifiManager 能提供，
                // 即使盒子走网线也一样。不是可选项。
                'LeanbackUsesWifi',

                // 提示「改用 apply()」—— 但 apply() 是异步落盘，
                // 而这个服务随时可能被低内存杀手干掉，UUID 必须同步写进去。
                'ApplySharedPref',

                // 通知栏图标是刻意做的纯白剪影（ic_notify），
                // lint 只看「图标里有非白像素」就报，属于误报。
                'IconColors',

                // TV 横幅按 Google 规范只有 xhdpi 一档（320×180），
                // lint 却要求每个密度目录都放一份，属于误报。
                'IconDensities',

                // android:banner 是 API 21+ 的属性，本机 API 15 上会被忽略。
                // 但留着它对老设备无害，对 Android TV 设备有用，所以保留。
                'UnusedAttribute',

                // 根布局的底色与主题底色重叠，多一次全屏填充。
                // 在老盒子上这点开销可以忽略，而拿掉底色会让面板切换时露出花屏。
                'Overdraw'
        )
    }
}

dependencies {
    // 刻意保持「零第三方依赖」：
    //   1) Android 4.0 设备内存普遍只有 512MB~1GB，多一个库就多一分被 LMK 杀的风险
    //   2) 不能用 AndroidX —— 新版 AndroidX 组件普遍要求 minSdk 19+，会直接编译不过
    //   3) SSDP / HTTP / SOAP 全部自实现，链路完全自控，方便针对稳定性做优化
    //
    // 如果你更想快速验证可行性、不想手写 UPnP，可以改用 Cling 2.1.2（注意不能用 3.x，它要 Java 8）：
    //   implementation('org.fourthline.cling:cling-core:2.1.2') { exclude module: 'servlet-api' }
    //   implementation('org.fourthline.cling:cling-support:2.1.2')
    // 代价是包体积增加约 1MB，且需要自己补一个 Android 版的 UpnpServiceConfiguration。
}
